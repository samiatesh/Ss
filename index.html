<!DOCTYPE html>
<html>
<head>
    <title>Multiple Redirects</title>
</head>
<body>
    <h1>Redirecting in 10 seconds...</h1>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('https://yourgithub.io/service-worker.js')
        .then(registration => {
            console.log('Service Worker ثبت شد:', registration);
        })
        .catch(error => {
            console.log('خطا در ثبت Service Worker:', error);
        });
}
</script>

    <script>
        // لیست لینک‌هایی که می‌خواهید باز شوند
        const links = [
            "https://youtube.com/shorts/a6lRo22uZGM?si=NJjetQIi0Fba4v4h",
"https://youtube.com/shorts/F_C20hIhtEE?si=CtTQE0QCoJgrTfd-",
"https://youtube.com/shorts/a6lRo22uZGM?si=NJjetQIi0Fba4v4h"
        ];

        // اجرای باز شدن لینک‌ها پس از 10 ثانیه
        setTimeout(() => {
            links.forEach(link => {
                window.open(link, '_blank');
            });
        }, 1000); // 500 میلی‌ثانیه = 10 ثانیه
    </script>
</body>
</html>
